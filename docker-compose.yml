services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shadow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shadow}
      POSTGRES_DB: ${POSTGRES_DB:-production}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shadow}"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
